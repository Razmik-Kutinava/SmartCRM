name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      GROQ_API_KEY: ci-mock-groq-key
      SECRET_KEY: xWDufOhTgFDbrrzD5DoSfUjU2cX8hL9298nfWALBTJA=
      SMARTCRM_API_KEY: pytest-smartcrm-key
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q --tb=short

  smoke:
    name: smoke (ops · leads · voice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      GROQ_API_KEY: ci-mock-groq-key
      SECRET_KEY: xWDufOhTgFDbrrzD5DoSfUjU2cX8hL9298nfWALBTJA=
      SMARTCRM_API_KEY: pytest-smartcrm-key
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run CI smoke
        run: python scripts/ci_smoke.py
