[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# timeout: не давать живому HTTP/LLM вешать весь CI (серый cancelled @ 20m)
timeout = 60
timeout_method = thread
addopts = -m "not live_eval"
markers =
    asyncio: mark a test as asynchronous (handled by pytest-asyncio)
    live_eval: live LLM eval по cases.jsonl (GROQ/Ollama; pytest -m live_eval)
testpaths = tests
