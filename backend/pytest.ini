[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live_eval"
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
markers =
    asyncio: mark a test as asynchronous (handled by pytest-asyncio)
    live_eval: live LLM eval по cases.jsonl (GROQ/Ollama; pytest -m live_eval)
testpaths = tests
